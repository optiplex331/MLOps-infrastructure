# The namespace is intentionally a value rather than a chart-owned Namespace.
# Create it with Helm's --create-namespace flag so uninstall cannot remove it.
namespace: llm-inference
fullnameOverride: llm-inference

replicaCount: 1

image:
  repository: vllm/vllm-openai
  digest: sha256:d623253f2ba246378421c9642e20885e65257f38418ff26d48c81aea1702521b
  pullPolicy: IfNotPresent

model:
  id: Qwen/Qwen3-4B-AWQ
  revision: 74d4bd2bd4bff9cafc9345221320bffb08b406a3

serving:
  maxModelLen: 4096
  maxNumSeqs: 1
  maxNewTokens: 512
  gpuMemoryUtilization: 0.85

speculativeDecoding:
  enabled: false
  draftModel:
    id: Qwen/Qwen3-0.6B
    revision: ""
  numSpeculativeTokens: 3

service:
  type: ClusterIP
  port: 8000

metrics:
  scrape: true
  path: /metrics

persistence:
  storageClassName: local-path
  accessMode: ReadWriteOnce
  size: 20Gi

resources:
  requests:
    cpu: "1"
    memory: 4Gi
    nvidia.com/gpu: "1"
  limits:
    cpu: "4"
    memory: 8Gi
    nvidia.com/gpu: "1"

nodeSelector:
  kubernetes.io/arch: amd64
  mlops.local/gpu: rtx-3080

tolerations:
  - key: mlops.local/gpu
    operator: Equal
    value: dedicated
    effect: NoSchedule

runtimeClassName: nvidia

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

probes:
  startup:
    failureThreshold: 60
    periodSeconds: 10
    timeoutSeconds: 5
  readiness:
    failureThreshold: 6
    periodSeconds: 5
    timeoutSeconds: 5
  liveness:
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 5
