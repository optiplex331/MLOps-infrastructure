name: vLLM wrapper image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set build timestamp
        id: metadata
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build or publish wrapper
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/llm-inference-vllm:sha-${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            VLLM_VERSION=0.13.0
            MODEL_PROFILE=phase-1-qwen3-4b-awq
            BUILD_TIMESTAMP=${{ steps.metadata.outputs.timestamp }}
      - name: Publish image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/llm-inference-vllm@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
