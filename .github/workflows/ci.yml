name: llm-inference-lab-infra

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out llm-inference-lab-infra
        uses: actions/checkout@v4
        with:
          path: llm-inference-lab-infra
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Run CPU-safe repository checks
        run: bin/check-ci
        working-directory: llm-inference-lab-infra
