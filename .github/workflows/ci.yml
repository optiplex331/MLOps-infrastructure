name: cpu-only-contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Infrastructure Repository
        uses: actions/checkout@v4
        with:
          path: MLOps-infrastructure
      - name: Check out Project Repository contracts and fixtures
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/MLOps
          path: MLOps
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Run CPU-only contract and boundary checks
        env:
          MLOPS_PROJECT_REPO: ${{ github.workspace }}/MLOps
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          kubectl kustomize platform/argo >/dev/null
          kubectl kustomize platform/mlflow >/dev/null
          kubectl kustomize platform/minio >/dev/null
          kubectl kustomize workflows >/dev/null
        working-directory: MLOps-infrastructure
