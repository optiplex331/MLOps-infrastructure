apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-inference-recording-rules
  labels:
    app.kubernetes.io/part-of: llm-inference-lab
spec:
  groups:
    - name: llm-inference-lab.rules
      interval: 15s
      rules:
        - record: llm_inference:request_rate5m
          expr: sum(rate(vllm:request_success_total[5m]))
        - record: llm_inference:request_error_rate5m
          expr: sum(rate(vllm:request_failure_total[5m]))
        - record: llm_inference:running_requests
          expr: sum(vllm:num_requests_running)
