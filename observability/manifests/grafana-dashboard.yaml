apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-inference-dashboard
  labels:
    grafana_dashboard: "1"
data:
  llm-inference.json: |
    {
      "title": "llm-inference Phase 1",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "panels": [
        {"type":"timeseries","title":"Request rate","targets":[{"expr":"llm_inference:request_rate5m"}]},
        {"type":"timeseries","title":"Request errors","targets":[{"expr":"llm_inference:request_error_rate5m"}]},
        {"type":"timeseries","title":"Running requests","targets":[{"expr":"llm_inference:running_requests"}]}
      ]
    }
