apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke
  namespace: mlops-runtime-admission
  labels:
    app.kubernetes.io/name: gpu-smoke
    mlops.local/evidence: runtime-admission
spec:
  activeDeadlineSeconds: 120
  automountServiceAccountToken: false
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/arch: amd64
    mlops.local/gpu: rtx-3080
  tolerations:
    - key: mlops.local/gpu
      operator: Equal
      value: dedicated
      effect: NoSchedule
  containers:
    - name: cuda-smoke
      image: nvidia/cuda@sha256:8767a245ed2c481eb245d8f6c625accc3788e1fb8612403d6b4cd4645a4f09c7
      imagePullPolicy: IfNotPresent
      command: ["nvidia-smi"]
      args:
        - --query-gpu=name,driver_version,memory.total
        - --format=csv,noheader,nounits
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
          nvidia.com/gpu: "1"
        limits:
          cpu: 500m
          memory: 256Mi
          nvidia.com/gpu: "1"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
