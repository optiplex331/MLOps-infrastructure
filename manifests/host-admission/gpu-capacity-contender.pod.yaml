{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {"name": "gpu-capacity-contender", "namespace": "mlops-host-admission"},
  "spec": {
    "activeDeadlineSeconds": 120,
    "automountServiceAccountToken": false,
    "containers": [{"args": ["--query-gpu=name", "--format=csv,noheader"], "command": ["nvidia-smi"], "image": "nvidia/cuda@sha256:8767a245ed2c481eb245d8f6c625accc3788e1fb8612403d6b4cd4645a4f09c7", "name": "contender", "resources": {"limits": {"nvidia.com/gpu": "1"}, "requests": {"nvidia.com/gpu": "1"}}, "securityContext": {"allowPrivilegeEscalation": false, "capabilities": {"drop": ["ALL"]}, "readOnlyRootFilesystem": true, "runAsNonRoot": true}}],
    "nodeSelector": {"mlops.local/gpu": "rtx-3080"},
    "restartPolicy": "Never",
    "runtimeClassName": "nvidia",
    "securityContext": {"runAsNonRoot": true, "seccompProfile": {"type": "RuntimeDefault"}},
    "tolerations": [{"effect": "NoSchedule", "key": "mlops.local/gpu", "operator": "Equal", "value": "dedicated"}]
  }
}
