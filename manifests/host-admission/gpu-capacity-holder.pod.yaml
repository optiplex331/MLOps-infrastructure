{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {"name": "gpu-capacity-holder", "namespace": "mlops-host-admission"},
  "spec": {
    "activeDeadlineSeconds": 180,
    "automountServiceAccountToken": false,
    "containers": [{"args": ["trap 'exit 0' TERM; sleep 150 & wait"], "command": ["/bin/sh", "-c"], "image": "nvidia/cuda@sha256:8767a245ed2c481eb245d8f6c625accc3788e1fb8612403d6b4cd4645a4f09c7", "name": "holder", "resources": {"limits": {"nvidia.com/gpu": "1"}, "requests": {"nvidia.com/gpu": "1"}}, "securityContext": {"allowPrivilegeEscalation": false, "capabilities": {"drop": ["ALL"]}}}],
    "nodeSelector": {"mlops.local/gpu": "rtx-3080"},
    "restartPolicy": "Never",
    "runtimeClassName": "nvidia",
    "terminationGracePeriodSeconds": 5,
    "tolerations": [{"effect": "NoSchedule", "key": "mlops.local/gpu", "operator": "Equal", "value": "dedicated"}]
  }
}
